<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="검수 스캐너">
<title>바코드 검수 스캐너</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
  :root{--bg:#f6f6f4;--card:#fff;--ink:#1d1d1b;--mute:#77756f;--line:#e4e2dc;--accent:#1f6f50;--warn:#b3412e}
  @media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1f1f1d;--ink:#f0efe9;--mute:#9a988f;--line:#33322e;--accent:#4fb58a;--warn:#e07a63}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  main{max-width:560px;margin:0 auto;padding:12px 14px 80px}
  h1{font-size:20px;margin:4px 0 10px}
  .cam{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:14px;overflow:hidden;display:none}
  .cam.on{display:block}
  video{width:100%;height:100%;object-fit:cover;display:block}
  .guide{position:absolute;left:10%;right:10%;top:35%;bottom:35%;border:3px solid rgba(255,255,255,.85);border-radius:10px;pointer-events:none}
  .cam.hit .guide{border-color:#4fe0a0;box-shadow:0 0 0 9999px rgba(79,224,160,.18)}
  .big{display:block;width:100%;padding:16px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:18px;font-weight:700;cursor:pointer;margin-top:10px}
  .big.stop{background:var(--warn)}
  .row{display:flex;gap:8px;margin-top:10px;align-items:center}
  .row input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:16px}
  .btn{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:15px;cursor:pointer;white-space:nowrap}
  .opt{font-size:14px;color:var(--mute);margin-top:10px;display:flex;justify-content:space-between;align-items:center}
  .opt select{font-size:14px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .msg{min-height:24px;margin:10px 2px;font-size:15px;color:var(--mute)}
  .msg.ok{color:var(--accent);font-weight:700}.msg.err{color:var(--warn)}
  .sum{display:flex;justify-content:space-between;align-items:baseline;margin:12px 2px 8px;font-size:14px;color:var(--mute)}
  .sum b{color:var(--ink);font-size:18px}
  ul{list-style:none;padding:0;margin:0}
  li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
  li.flash{outline:2px solid var(--accent)}
  .info{flex:1;min-width:0}
  .name{width:100%;border:0;background:transparent;color:var(--ink);font-size:16px;font-weight:600;padding:2px 0}
  .name::placeholder{color:var(--mute);font-weight:400}
  .code{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
  .qty{display:flex;align-items:center;gap:6px}
  .qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
  .qty span{min-width:30px;text-align:center;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .empty{color:var(--mute);text-align:center;padding:28px 0;font-size:14px}
  .foot{display:flex;gap:8px;margin-top:14px}.foot .btn{flex:1}
  .danger{color:var(--warn)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
  .modal.on{display:flex}
  .box{background:var(--card);border-radius:14px;padding:18px;max-width:340px;width:100%}
  .box p{margin:0 0 14px}
  textarea{width:100%;height:160px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:10px;font-size:14px}
</style>
</head>
<body>
<main>
  <h1>바코드 검수 스캐너</h1>

  <div class="cam" id="cam"><video id="video" playsinline muted autoplay></video><div class="guide"></div></div>
  <button class="big" id="toggle">📷 스캔 시작</button>

  <div class="opt">
    <span>같은 상품 다시 셀 때까지 기다림</span>
    <select id="gap">
      <option value="1000">1초</option>
      <option value="1500" selected>1.5초</option>
      <option value="2500">2.5초</option>
      <option value="999999">다른 상품 찍기 전엔 안 셈</option>
    </select>
  </div>

  <form class="row" id="manual">
    <input id="code" inputmode="numeric" placeholder="바코드 번호 직접 입력" autocomplete="off">
    <button class="btn" type="submit">추가</button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="sum"><span>상품 <b id="kinds">0</b>종</span><span>총 <b id="total">0</b>개</span></div>
  <ul id="list"></ul>

  <div class="foot">
    <button class="btn" id="copy">결과 복사</button>
    <button class="btn danger" id="reset">전체 초기화</button>
  </div>
  <div class="foot">
    <button class="btn" id="backup">상품 이름 백업·불러오기</button>
  </div>
</main>

<div class="modal" id="namebox"><div class="box">
  <p><b>처음 보는 상품이에요</b><br><small style="color:var(--mute)" id="namecode"></small></p>
  <input id="namein" placeholder="상품 이름 (예: 새우깡 90g)" autocomplete="off"
         style="width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px">
  <div class="msg" id="namehint" style="margin:6px 2px 10px"></div>
  <div class="row"><button class="btn" id="nameskip" style="flex:1">나중에</button><button class="btn" id="namesave" style="flex:1;background:var(--accent);color:#fff;border:0">저장</button></div>
</div></div>

<div class="modal" id="bkbox"><div class="box">
  <p><b>상품 이름 백업·불러오기</b><br><small style="color:var(--mute)">백업: 아래 내용을 전부 복사해서 메모장 등에 저장하세요.<br>불러오기: 저장해둔 내용을 붙여넣고 불러오기를 누르세요.</small></p>
  <textarea id="bktext"></textarea>
  <div class="msg" id="bkmsg" style="margin:6px 2px"></div>
  <div class="row"><button class="btn" id="bkclose" style="flex:1">닫기</button><button class="btn" id="bkload" style="flex:1">불러오기</button></div>
</div></div>

<div class="modal" id="confirm"><div class="box">
  <p>수량을 전부 지울까요?<br><small style="color:var(--mute)">입력한 상품 이름은 남아요.</small></p>
  <div class="row"><button class="btn" id="no" style="flex:1">취소</button><button class="btn danger" id="yes" style="flex:1">초기화</button></div>
</div></div>

<div class="modal" id="copybox"><div class="box">
  <p>아래 내용을 길게 눌러 복사하세요.</p>
  <textarea id="copytext" readonly></textarea>
  <div class="row"><button class="btn" id="close" style="flex:1">닫기</button></div>
</div></div>

<script>
(function(){
  var KEY_COUNT='bc_counts_v1', KEY_NAME='bc_names_v1', KEY_ORDER='bc_order_v1';
  function load(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v||d}catch(e){return d}}
  var counts=load(KEY_COUNT,{}), names=load(KEY_NAME,{}), order=load(KEY_ORDER,Object.keys(counts));
  function save(){try{localStorage.setItem(KEY_COUNT,JSON.stringify(counts));localStorage.setItem(KEY_NAME,JSON.stringify(names));localStorage.setItem(KEY_ORDER,JSON.stringify(order))}catch(e){}}
  var $=function(id){return document.getElementById(id)};
  var msgEl=$('msg'), listEl=$('list'), lastCode=null, lastTime=0, audio=null;

  function msg(t,cls){msgEl.textContent=t;msgEl.className='msg'+(cls?' '+cls:'')}

  function beep(){
    try{
      if(!audio) return;
      var o=audio.createOscillator(), g=audio.createGain();
      o.frequency.value=1800; g.gain.value=0.15; o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime+0.09);
    }catch(e){}
  }

  function add(code,n){
    code=String(code).trim(); if(!code) return;
    if(!(code in counts)) counts[code]=0;
    order=order.filter(function(c){return c!==code}); order.unshift(code);
    counts[code]=counts[code]+(n||1);
    lastCode=code; save(); render();
    msg('✔ '+(names[code]||code)+' → '+counts[code]+'개','ok');
    beep(); if(navigator.vibrate){try{navigator.vibrate(60)}catch(e){}}
    var cam=$('cam'); cam.classList.add('hit'); setTimeout(function(){cam.classList.remove('hit')},250);
  }

  function render(){
    var keys=order.filter(function(c){return c in counts});
    var total=0; keys.forEach(function(c){total+=counts[c]});
    $('kinds').textContent=keys.length; $('total').textContent=total;
    if(!keys.length){listEl.innerHTML='<div class="empty">아직 찍은 상품이 없어요</div>';return}
    listEl.innerHTML='';
    keys.forEach(function(c){
      var li=document.createElement('li'); if(c===lastCode) li.className='flash';
      li.innerHTML='<div class="info"><input class="name" placeholder="상품 이름 입력(선택)"><div class="code"></div></div>'+
        '<div class="qty"><button aria-label="빼기">−</button><span></span><button aria-label="더하기">+</button></div>';
      var nameIn=li.querySelector('.name'); nameIn.value=names[c]||'';
      nameIn.addEventListener('change',function(){var v=nameIn.value.trim(); if(v) names[c]=v; else delete names[c]; save()});
      li.querySelector('.code').textContent=c;
      li.querySelector('.qty span').textContent=counts[c];
      var b=li.querySelectorAll('.qty button');
      b[0].onclick=function(){
        if(counts[c]<=1){delete counts[c];order=order.filter(function(x){return x!==c})} else counts[c]--;
        save();render();
      };
      b[1].onclick=function(){counts[c]++;save();render()};
      listEl.appendChild(li);
    });
  }

  // ---- 실시간 스캔 ----
  var reader=null, running=false;
  function makeReader(){
    var hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[
      ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.QR_CODE]);
    return new ZXing.BrowserMultiFormatReader(hints,150);
  }

  function onResult(result){
    if(!result || naming) return;
    var code=result.getText(), now=Date.now(), gap=+$('gap').value;
    if(code===lastCode && now-lastTime<gap){ lastTime=now; return; } // 같은 바코드가 계속 보이면 시간 연장
    lastTime=now; handleScan(code);
  }

  // ---- 처음 보는 상품 이름 입력 ----
  var naming=null;
  function handleScan(code){
    code=String(code).trim(); if(!code) return;
    add(code,1);
    if(!names[code]) askName(code);
  }
  function askName(code){
    naming=code;
    $('namecode').textContent='바코드 '+code;
    $('namein').value=''; $('namehint').textContent='이름 찾는 중…'; $('namehint').className='msg';
    $('namebox').classList.add('on');
    setTimeout(function(){ try{$('namein').focus()}catch(e){} },50);
    lookup(code).then(function(n){
      if(naming!==code) return;
      if(n && !$('namein').value){ $('namein').value=n; $('namehint').textContent='자동으로 찾은 이름이에요. 맞는지 확인하고 고쳐주세요.'; }
      else if(!n) $('namehint').textContent='자동으로 못 찾았어요. 직접 입력해 주세요.';
    });
  }
  function closeName(){ $('namebox').classList.remove('on'); naming=null; lastTime=Date.now(); }
  $('namesave').onclick=function(){
    var v=$('namein').value.trim();
    if(naming && v){ names[naming]=v; save(); render(); msg('✔ '+v+' → '+counts[naming]+'개','ok'); }
    closeName();
  };
  $('nameskip').onclick=closeName;
  $('namein').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); $('namesave').click(); } });

  // 해외 무료 상품 목록(Open Food Facts)에서 이름 찾아보기 — 한국 상품은 없는 경우 많음
  function lookup(code){
    var ctrl=('AbortController' in window)?new AbortController():null;
    if(ctrl) setTimeout(function(){ctrl.abort()},4000);
    return fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,product_name_ko,brands,quantity',
                 ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.ok?r.json():null})
      .then(function(j){
        if(!j||j.status!==1||!j.product) return null;
        var p=j.product, n=p.product_name_ko||p.product_name||'';
        if(!n) return null;
        if(p.quantity) n+=' '+p.quantity;
        return n.trim();
      })
      .catch(function(){return null});
  }

  // ---- 이름 백업·불러오기 ----
  $('backup').onclick=function(){
    var lines=Object.keys(names).map(function(c){return c+'\t'+names[c]});
    $('bktext').value=lines.join('\n');
    $('bkmsg').textContent='저장된 이름 '+lines.length+'개'; $('bkmsg').className='msg';
    $('bkbox').classList.add('on');
  };
  $('bkclose').onclick=function(){$('bkbox').classList.remove('on')};
  $('bkload').onclick=function(){
    var n=0;
    $('bktext').value.split(/\r?\n/).forEach(function(line){
      var m=line.match(/^\s*(\d{6,14})[\t ,:]+(.+?)\s*$/);
      if(m){ names[m[1]]=m[2]; n++; }
    });
    save(); render();
    $('bkmsg').textContent=n?('이름 '+n+'개를 불러왔어요'):'불러올 내용을 못 찾았어요. "바코드 이름" 형식인지 확인하세요.';
    $('bkmsg').className='msg '+(n?'ok':'err');
  };

  async function start(){
    if(!window.ZXing){msg('스캐너를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침하세요.','err');return}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg('이 브라우저에선 카메라를 쓸 수 없어요. 사파리로 열어주세요.','err');return}
    try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); if(audio.resume) audio.resume(); }catch(e){}
    reader=reader||makeReader();
    $('cam').classList.add('on');
    var t=$('toggle'); t.textContent='■ 스캔 멈추기'; t.classList.add('stop'); running=true;
    msg('바코드를 네모 안에 비춰주세요');
    try{
      await reader.decodeFromConstraints(
        {audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}},
        $('video'),
        function(result){ onResult(result); }
      );
    }catch(e){
      stop();
      msg(e&&e.name==='NotAllowedError'?'카메라 권한이 거부됐어요. 설정 > Safari > 카메라에서 허용해 주세요.':'카메라를 켜지 못했어요. 새로고침 후 다시 시도하세요.','err');
    }
  }
  function stop(){
    running=false;
    try{ if(reader) reader.reset(); }catch(e){}
    $('cam').classList.remove('on');
    var t=$('toggle'); t.textContent='📷 스캔 시작'; t.classList.remove('stop');
  }
  $('toggle').onclick=function(){ running?stop():start(); };
  document.addEventListener('visibilitychange',function(){ if(document.hidden&&running){stop();msg('화면을 벗어나서 스캔을 멈췄어요')} });

  // ---- 기타 ----
  $('manual').addEventListener('submit',function(e){
    e.preventDefault(); var v=$('code').value.replace(/\s/g,'');
    if(v){handleScan(v);$('code').value=''}
  });
  $('reset').onclick=function(){$('confirm').classList.add('on')};
  $('no').onclick=function(){$('confirm').classList.remove('on')};
  $('yes').onclick=function(){counts={};order=[];lastCode=null;save();render();msg('초기화했어요');$('confirm').classList.remove('on')};
  $('copy').onclick=async function(){
    var keys=order.filter(function(c){return c in counts}), total=0;
    var lines=keys.map(function(c){total+=counts[c];return (names[c]||c)+' : '+counts[c]+'개'});
    var text=lines.length?lines.join('\n')+'\n— 총 '+keys.length+'종 '+total+'개':'(비어 있음)';
    try{await navigator.clipboard.writeText(text);msg('결과를 복사했어요','ok')}
    catch(e){$('copytext').value=text;$('copybox').classList.add('on')}
  };
  $('close').onclick=function(){$('copybox').classList.remove('on')};

  render();
})();
</script>
</body>
</html>
